<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Money Locks - Smart Wallet</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <header class="dashboard-header">
      <h1>Smart Wallet</h1>

      <div>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      </div>
    </header>

    <main>
      <section class="locks-page-header">
        <h2>Money Locks</h2>

        <p>
          Protect your savings from impulsive spending and stay focused on your
          goals.
        </p>
        <a href="{{ url_for('create_lock') }}" class="create-lock-btn">
          + Create New Lock
        </a>
      </section>

      <section class="all-locks">
        <div class="lock-card">
          <div class="lock-top">
            <h3>Vacation Fund</h3>
            <span class="status active">Active</span>
          </div>

          <p class="amount">₹5,000 / ₹10,000</p>

          <div class="progress-bar">
            <div class="progress-fill" style="width: 50%"></div>
          </div>

          <p class="progress-text">50% Complete</p>

          <div class="lock-actions">
            <button>View Details</button>
          </div>
        </div>

        <div class="lock-card">
          <div class="lock-top">
            <h3>Laptop Fund</h3>
            <span class="status active">Active</span>
          </div>

          <p class="amount">₹3,000 / ₹8,000</p>

          <div class="progress-bar">
            <div class="progress-fill" style="width: 37%"></div>
          </div>

          <p class="progress-text">37% Complete</p>

          <div class="lock-actions">
            <button>View Details</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
