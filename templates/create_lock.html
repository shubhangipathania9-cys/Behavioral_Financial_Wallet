<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Lock - Smart Wallet</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <header class="dashboard-header">
      <h1>Smart Wallet</h1>

      <div>
        <a href="{{ url_for('money_locks') }}">Money Locks</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      </div>
    </header>

    <main>
      <section class="create-lock-section">
        <h2>Create a New Money Lock</h2>

        <p>
          Set aside money for something important and protect it from impulsive
          spending.
        </p>

        <form class="lock-form">
          <label for="lock-name">Lock Name</label>
          <input
            type="text"
            id="lock-name"
            name="lock_name"
            placeholder="e.g. Vacation Fund"
          />

          <label for="goal-amount">Goal Amount</label>
          <input
            type="number"
            id="goal-amount"
            name="goal_amount"
            placeholder="e.g. 10000"
            min="1"
          />

          <label for="lock-amount">Amount to Lock</label>
          <input
            type="number"
            id="lock-amount"
            name="lock_amount"
            placeholder="e.g. 2000"
            min="1"
          />

          <label for="duration">Lock Duration</label>
          <select id="duration" name="duration">
            <option value="">Select duration</option>
            <option value="7">7 Days</option>
            <option value="30">30 Days</option>
            <option value="90">90 Days</option>
            <option value="180">6 Months</option>
            <option value="365">1 Year</option>
          </select>

          <div class="form-actions">
            <a href="{{ url_for('money_locks') }}" class="cancel-btn">
              Cancel
            </a>

            <button type="submit" class="create-lock-btn">Create Lock</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
